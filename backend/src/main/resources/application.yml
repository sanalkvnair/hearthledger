spring:
  application:
    name: hearthledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hearthledger}
    username: ${DB_USER:hearthledger}
    password: ${DB_PASSWORD:hearthledger}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,profile,email

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: PT1H
    refresh-ttl: P30D
  llm:
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
