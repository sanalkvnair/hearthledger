name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: JWT_SECRET=$(openssl rand -hex 32) GOOGLE_CLIENT_ID=x GOOGLE_CLIENT_SECRET=x docker compose up -d --build --wait --wait-timeout 240
      - run: sh scripts/smoke.sh http://localhost:8081
      - if: failure()
        run: docker compose logs --tail=100

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}

  # Runs on the home server (self-hosted Windows runner). Enable with the repository variable DEPLOY_ENABLED=true.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: [self-hosted, windows, hearthledger]
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        shell: powershell
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ github.repository }}
          TAG: ${{ github.sha }}
        run: |
          if (-not $env:DEPLOY_DIR) { throw 'Set the repository variable DEPLOY_DIR to the folder with the checkout and .env' }
          git -C $env:DEPLOY_DIR pull --ff-only
          if ($LASTEXITCODE -ne 0) { throw 'git pull failed' }
          & "$env:DEPLOY_DIR\scripts\deploy.ps1" -Dir $env:DEPLOY_DIR -ImagePrefix $env:IMAGE_PREFIX -Tag $env:TAG
