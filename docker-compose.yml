services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: familybudget
      POSTGRES_USER: familybudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familybudget}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familybudget"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/familybudget
      DB_USER: familybudget
      DB_PASSWORD: ${POSTGRES_PASSWORD:-familybudget}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8081}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
